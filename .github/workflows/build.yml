name: Build ColAndreas

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Linux armeabi-v7a (ARM 32-bit)
  # ============================================================
  build-linux-armv7:
    name: Linux (armeabi-v7a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-arm-linux-gnueabihf

      - name: Build WizardCLI
        run: |
          cd WizardCLI
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_C_FLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=neon" \
            -DCMAKE_CXX_FLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=neon"
          cmake --build . -j$(nproc)

          mkdir -p ../../dist/armeabi-v7a
          cp wizard ../../dist/armeabi-v7a/

      - name: Package WizardCLI
        run: |
          cd dist/armeabi-v7a
          zip -r ../../Wizard-CLI-armeabi-v7a.zip wizard
          cd ../..

      - name: Upload WizardCLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wizard-CLI-armeabi-v7a
          path: Wizard-CLI-armeabi-v7a.zip

  # ============================================================
  # Linux arm64-v8a (ARM 64-bit)
  # ============================================================
  build-linux-arm64:
    name: Linux (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Build WizardCLI
        run: |
          cd WizardCLI
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_FLAGS="-march=armv8-a" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a"
          cmake --build . -j$(nproc)

          mkdir -p ../../dist/arm64-v8a
          cp wizard ../../dist/arm64-v8a/

      - name: Package WizardCLI
        run: |
          cd dist/arm64-v8a
          zip -r ../../Wizard-CLI-arm64-v8a.zip wizard
          cd ../..

      - name: Upload WizardCLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wizard-CLI-arm64-v8a
          path: Wizard-CLI-arm64-v8a.zip

  # ============================================================
  # Linux x86 (i386 32-bit)
  # ============================================================
  build-linux-x86:
    name: Linux (x86)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++-multilib \
            lib32z1 \
            wget

      - name: Build and install Bullet 3.17 (32-bit)
        run: |
          wget https://github.com/bulletphysics/bullet3/archive/refs/tags/3.17.tar.gz
          tar xzf 3.17.tar.gz
          cd bullet3-3.17
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_BULLET2_DEMOS=OFF \
            -DBUILD_OPENGL3_DEMOS=OFF \
            -DBUILD_UNIT_TESTS=OFF \
            -DBUILD_EXTRAS=OFF \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib/i386-linux-gnu
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build WizardCLI
        run: |
          cd WizardCLI
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32"
          cmake --build . -j$(nproc)

          mkdir -p ../../dist/linux_x86
          cp wizard ../../dist/linux_x86/

      - name: Build Plugin
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32"
          cmake --build . -j$(nproc)

          mkdir -p ../dist/linux_x86
          cp ColAndreas.so ../dist/linux_x86/
          cp ColAndreas_static.so ../dist/linux_x86/ 2>/dev/null || true

      - name: Package WizardCLI
        run: |
          cd dist
          cp linux_x86/wizard .
          zip -r ../Wizard-CLI-linux_x86.zip wizard
          rm wizard
          cd ..

      - name: Package Plugin
        run: |
          cd dist/linux_x86
          zip -r ../../ColAndreas-linux_x86.zip *.so
          cd ../..

      - name: Upload WizardCLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wizard-CLI-linux_x86
          path: Wizard-CLI-linux_x86.zip

      - name: Upload Plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ColAndreas-linux_x86
          path: ColAndreas-linux_x86.zip

  # ============================================================
  # Linux x86_64 (64-bit)
  # ============================================================
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \

      - name: Build WizardCLI
        run: |
          cd WizardCLI
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

          mkdir -p ../../dist/linux_x86_64
          cp wizard ../../dist/linux_x86_64/

      - name: Package WizardCLI
        run: |
          cd dist
          cp linux_x86_64/wizard .
          zip -r ../Wizard-CLI-linux_x86_64.zip wizard
          rm wizard
          cd ..

      - name: Upload WizardCLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wizard-CLI-linux_x86_64
          path: Wizard-CLI-linux_x86_64.zip

  # ============================================================
  # Windows Win32 (32-bit)
  # ============================================================
  build-windows-x86:
      name: Windows (Win32)
      runs-on: windows-2025-vs2026
      steps:
        - uses: actions/checkout@v6

        - name: Build (Win32)
          shell: pwsh
          run: |
            # Resolve Visual Studio path
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath

            # Download Bullet
            curl -L -o bullet3.zip https://github.com/bulletphysics/bullet3/archive/refs/tags/3.17.zip
            Expand-Archive bullet3.zip -Force

            echo "======= [ DIRECTORIES ] ======="
            ls
            ls bullet*

            $bullet = "bullet3"
            cd $bullet
            ls
            exit 0


            # TUDO roda dentro do cmd pra manter ambiente
            cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x86 && ^
              cd $($bullet.FullName) && ^
              mkdir build && cd build && ^
              cmake .. -DCMAKE_BUILD_TYPE=Release -A Win32 -DBUILD_SHARED_LIBS=OFF -DBUILD_UNIT_TESTS=OFF -DBUILD_EXTRAS=OFF && ^
              cmake --build . --config Release && ^
              cmake --install . --prefix $env:GITHUB_WORKSPACE\bullet_install && ^

              cd $env:GITHUB_WORKSPACE\WizardCLI && ^
              mkdir build && cd build && ^
              cmake .. -DCMAKE_BUILD_TYPE=Release -A Win32 && ^
              cmake --build . --config Release && ^

              mkdir $env:GITHUB_WORKSPACE\dist\windows_Win32 && ^
              copy Release\wizard.exe $env:GITHUB_WORKSPACE\dist\windows_Win32\ && ^

              cd $env:GITHUB_WORKSPACE && ^
              mkdir build && cd build && ^
              cmake .. -DCMAKE_BUILD_TYPE=Release -A Win32 ^
                -DBULLET_INCLUDE_DIR=$env:GITHUB_WORKSPACE\bullet_install\include\bullet ^
                -DBULLET_COLLISION_LIBRARY=$env:GITHUB_WORKSPACE\bullet_install\lib\BulletCollision.lib ^
                -DBULLET_DYNAMICS_LIBRARY=$env:GITHUB_WORKSPACE\bullet_install\lib\BulletDynamics.lib ^
                -DBULLET_MATH_LIBRARY=$env:GITHUB_WORKSPACE\bullet_install\lib\LinearMath.lib && ^
              cmake --build . --config Release && ^

              copy Release\ColAndreas.dll $env:GITHUB_WORKSPACE\dist\windows_Win32\"

        - name: Package
          run: |
            cd dist/windows_Win32
            Compress-Archive -Path wizard.exe -DestinationPath ../../Wizard-CLI-windows_Win32.zip -Force
            Compress-Archive -Path ColAndreas.dll -DestinationPath ../../ColAndreas-windows_Win32.zip -Force
            cd ../..

        - uses: actions/upload-artifact@v7
          with:
            name: Wizard-CLI-windows_Win32
            path: Wizard-CLI-windows_Win32.zip

        - uses: actions/upload-artifact@v7
          with:
            name: ColAndreas-windows_Win32
            path: ColAndreas-windows_Win32.zip

  # ============================================================
  # Windows x64 (64-bit)
  # ============================================================
  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC (x86)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          & "$vs\Common7\Tools\VsDevCmd.bat" -arch=amd64

      - name: Build WizardCLI
        run: |
          cd WizardCLI
          mkdir build -Force
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -A x64
          cmake --build . --config Release -j

          mkdir -Force ../../dist/windows_x64
          cp Release/wizard.exe ../../dist/windows_x64/

      - name: Package WizardCLI
        run: |
          cd dist
          Copy-Item windows_x64/wizard.exe .
          Compress-Archive -Path wizard.exe -DestinationPath ../Wizard-CLI-windows_x64.zip -Force
          Remove-Item wizard.exe
          cd ..

      - name: Upload WizardCLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wizard-CLI-windows_x64
          path: Wizard-CLI-windows_x64.zip

  # ============================================================
  # Create Release (only on version tags)
  # ============================================================
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-armv7
      - build-linux-arm64
      - build-linux-x86
      - build-linux-x64
      - build-windows-x86
      - build-windows-x64
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
